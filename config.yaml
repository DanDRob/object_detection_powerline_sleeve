# Powerline Sleeve Detection Configuration

# Paths
paths:
  data_dir: "data"
  raw_images: "data/raw"
  labeled_images: "data/labeled"
  processed_dataset: "data/processed"
  models_dir: "models"
  results_dir: "results"

api:
  key: ${GOOGLE_API_KEY}
  min_request_interval: 0.1
  max_retries: 3
  retry_delay: 1.0
  image_width: 640
  image_height: 640

sampling:
  base_interval: 20.0 # meters
  max_extra_points: 5

camera:
  altitude: 2.5 # meters
  pitch_values: [0, 30, 60]
  fov_default: [55]
  fov_special: [40]
  relative_angles_right: [90, 45, 135]
  relative_angles_left: [270, 310, 230]

powerline:
  offset_distance: 10.0 # meters from road centerline
  side: "both" # right, left, or both

system:
  output_dir: "output"
  num_workers: 8
  debug: false
  cache_dir: ".cache"

## Powerline Sleeve Detection Configuration
extra: 
  mixup: 0.1
  cutmix: 0.1
  shear: 20.0
  multi_scale: True
  perspective: 0.00005
  degrees: 10.0

# Acquisition
acquisition:
  api_key: ${GOOGLE_API_KEY}  # Google Street View API key
  image_size: [640, 640]
  cache_enabled: true
  cache_dir: "data/cache"
  distance_interval: 20  # meters between consecutive images

# Labeling
labeling:
  tool: "labelme"  # Tool used for manual labeling
  classes: ["powerline", "sleeve"]
  auto_labeling:
    confidence_threshold: 0.5
    iou_threshold: 0.45

# Dataset
dataset:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  yolo_format: true
  augmentation:
    enabled: true
    rotation_range: 15
    brightness_range: [0.8, 1.2]
    contrast_range: [0.8, 1.2]
    horizontal_flip: true
    vertical_flip: false

# Training
training:
  # Common parameters
  batch_size: 16
  epochs: 100
  image_size: [640, 640]
  patience: 15  # Early stopping
  optimizer: "Adam"
  learning_rate: 0.001
  device: "cuda"  # or "cpu"
  
  # Powerline detection model
  powerline:
    model_type: "yolo12s" 
    pretrained: true
    classes: ["powerline"]
  
  # Sleeve detection model
  sleeve:
    model_type: "yolo12s" 
    pretrained: true
    classes: ["sleeve"]
    two_stage: true  # Use two-stage detection (powerline first, then sleeve)

# Detection
detection:
  confidence_threshold: 0.4
  iou_threshold: 0.45
  max_detections: 100
  batch_size: 16
  ensemble:
    enabled: false
    models: []
    weights: []
    method: "weighted_boxes_fusion"

# Visualization
visualization:
  save_images: true
  draw_bounding_boxes: true
  line_thickness: 2S
  text_size: 1.0
  map:
    enabled: true
    zoom_level: 15
    marker_size: 5

# Configuration for YOLOv8 Training

# --- Dataset Configuration ---
# Path to the YOLOv8 dataset YAML file (e.g., data.yaml)
# This file defines train/val/test paths and class names.
dataset_yaml_path: data/powerlines/original/original.yaml  # *** ADJUST THIS PATH ***

# --- Model Configuration ---
# Pre-trained model to start from (e.g., yolov8n.pt, yolov8s.pt, yolov8m.pt)
# Or path to a previously trained model checkpoint (.pt file)
model_type: yolo12l.pt 

# --- Training Hyperparameters ---
hyperparams:
  epochs: 250          # Number of training epochs
  batch: 192       # Batch size (-1 for AutoBatch)
  imgsz: 640 # Input image size (pixels)
  workers: 24 # num workers
  save_period: 2
  plots: True 
  cache: True 
  close_mosaic: 15 # Disables mosaicaugmentation in the last N epochs to stabilize training before completion.
  single_cls: True #f
  warmup_epochs: 5.0 #prevents blowing up
  optimizer: "AdamW" #ecfd
  cos_lr: True # d 
  freeze: 10 #stabilizes
  seed: 42 # ds d
  box: 6.0 # d
  cls: 0.3 # 
  patience: 40 # wait time before stopping
  lr0: 0.001  # Initial learning rate (lr0)
  
  # Add other YOLOv8 train arguments here if needed (e.g., optimizer, patience, weight_decay)
  # See: https://docs.ultralytics.com/modes/train/#arguments

# --- Output Configuration ---
# Directory to save results (weights, logs, plots)
output_config:
  project: results/YOLOv12l_T_augs  # Base directory for all experiments
  name: experiment1           # Specific name for this run (e.g., powerlines_v1, sleeves_augmented)

# --- Environment Configuration ---
# Device to use: 'cpu', '0' (for GPU 0), '0,1,2,3' (for multiple GPUs)
device: '0' # *** ADJUST IF USING GPU *** 